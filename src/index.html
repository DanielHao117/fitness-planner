<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />
  <title>FITNESS</title>
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="训练计划与动作管理" />

  <!-- iOS 添加到主屏 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FITNESS" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <svg class="embers" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="emberFill" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#ff8a00" />
          <stop offset="55%" stop-color="#ffd24a" />
          <stop offset="100%" stop-color="#fffbe6" />
        </linearGradient>
        <filter id="emberGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="1.6" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <g filter="url(#emberGlow)" fill="url(#emberFill)">
        <path class="ember e1" d="M200,40 C194,32 200,26 203,22 C206,26 206,32 200,40 Z" />
        <path class="ember e2" d="M470,26 C465,20 465,16 468,12 C471,16 475,20 470,26 Z" />
        <path class="ember e3" d="M760,44 C753,36 758,30 764,26 C769,30 767,36 760,44 Z" />
        <path class="ember e4" d="M1030,30 C1025,24 1025,20 1027,16 C1030,20 1035,24 1030,30 Z" />
      </g>
    </svg>
    <h1>FITNESS</h1>
  </header>

  <main>
    <!-- 训练计划（动作直接属于计划） -->
    <section id="view-plans" class="view active">
      <p id="plans-empty" class="empty hidden">Make The Plan, Just Do It!</p>
      <div class="toolbar">
        <button id="new-plan" class="primary">＋ 新建计划</button>
      </div>
      <div id="plans-list" class="cards"></div>
    </section>
  </main>

  <!-- 计划编辑弹层 -->
  <div id="plan-modal" class="overlay hidden">
    <div class="modal wide">
      <div class="modal-head">
        <h2 id="plan-modal-title">新建计划</h2>
        <button class="icon-btn" data-close="plan-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="items-head">
          <h3>训练动作</h3>
          <div class="items-actions">
            <button id="add-item" class="primary">＋ 添加动作</button>
            <button id="manage-library" class="primary">管理动作库</button>
          </div>
        </div>
        <div id="plan-items"></div>
        <p id="items-empty" class="empty hidden">点击「添加动作」，赶快开始你的训练吧！</p>
      </div>
      <div class="modal-foot">
        <button class="ghost" data-close="plan-modal">取消</button>
        <button id="save-plan" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 计划详情弹层 -->
  <div id="detail-modal" class="overlay hidden">
    <div class="modal wide">
      <div class="modal-head">
        <h2 id="detail-title">计划详情</h2>
        <button class="icon-btn" data-close="detail-modal">✕</button>
      </div>
      <div id="detail-body" class="modal-body"></div>
      <div class="modal-foot">
        <button class="ghost" data-close="detail-modal">关闭</button>
      </div>
    </div>
  </div>

  <!-- 管理动作库弹层 -->
  <div id="library-modal" class="overlay hidden">
    <div class="modal wide">
      <div class="modal-head">
        <h2>管理动作库</h2>
        <button class="icon-btn" data-close="library-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="lib-grid">
          <div class="lib-col">
            <div class="items-head">
              <h3>部位</h3>
              <button id="lib-add-group" class="ghost">＋ 添加部位</button>
            </div>
            <div id="lib-group-list" class="lib-list"></div>
          </div>
          <div class="lib-col">
            <div class="items-head">
              <h3 id="lib-ex-title">动作</h3>
              <button id="lib-add-ex" class="ghost">＋ 添加动作</button>
            </div>
            <div id="lib-ex-list" class="lib-list"></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="primary" data-close="library-modal">完成</button>
      </div>
    </div>
  </div>

  <!-- 组/次/重量 轮盘弹层 -->
  <div id="wheel-modal" class="overlay hidden">
    <div class="modal wheel-modal">
      <div class="modal-head">
        <h2 id="wheel-title">选择数值</h2>
        <button class="icon-btn" data-close="wheel-modal">✕</button>
      </div>
      <div class="wheel-body">
        <div class="wheel-labels"><span>组</span><span>次</span><span>重量kg</span></div>
        <div id="wheel-wheels" class="wheel-wheels">
          <div class="wheel-band"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="ghost" data-close="wheel-modal">取消</button>
        <button id="wheel-confirm" class="primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 视频弹层 -->
  <div id="video-modal" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="video-title">动作演示</h2>
        <button class="icon-btn" data-close="video-modal">✕</button>
      </div>
      <div id="video-body" class="video-body"></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="main.js"></script>
  <script>
    const inTauri = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);
    if (
      "serviceWorker" in navigator &&
      location.protocol.startsWith("http") &&
      !inTauri
    ) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js", { updateViaCache: "none" })
          .then((reg) => reg.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
